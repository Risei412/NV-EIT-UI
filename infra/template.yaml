AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: NV-EIT-UI spectrum API

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Architectures: [arm64]
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "*"
      AllowHeaders:
        - content-type
      AllowMethods:
        - POST
        - OPTIONS

Resources:
  SpectrumFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nv-eit-ui-spectrum
      Runtime: python3.12
      Handler: apps.api.handler.lambda_handler
      CodeUri: ..
      Events:
        Spectrum:
          Type: HttpApi
          Properties:
            Path: /spectrum
            Method: POST

Outputs:
  SpectrumApi:
    Description: POST this URL from the UI
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/spectrum"
